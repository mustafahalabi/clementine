<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Clementine — convert any file by dragging it</title>
<meta name="description" content="Hold Shift while you drag a file and a wheel of formats opens under your pointer. Free for macOS. Everything stays on your Mac.">
<meta property="og:title" content="Clementine — convert any file by dragging it">
<meta property="og:description" content="Hold Shift while you drag a file and a wheel of formats opens under your pointer. Free for macOS.">
<meta property="og:image" content="https://mustafahalabi.github.io/clementine/poster.jpg">
<meta property="og:video" content="https://mustafahalabi.github.io/clementine/clementine-launch.mp4">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="icon.png">
<style>
  :root { --tangerine: #FF9A3C; --blood: #FF5E3A; --peach: #FFD3A8; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; color: #fff;
    font: 16px/1.5 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Inter", system-ui, sans-serif;
    background: radial-gradient(1200px 600px at 50% -10%, #4a2414 0%, #1a0d0a 55%, #0a0605 100%);
    display: flex; flex-direction: column; align-items: center; padding: 56px 20px 64px;
  }
  header { display: flex; align-items: center; gap: 14px; margin-bottom: 10px; }
  header img { width: 56px; height: 56px; }
  h1 { font-size: 40px; letter-spacing: -0.03em; margin: 0; font-weight: 700; }
  .tag { color: var(--peach); margin: 0 0 32px; font-size: 18px; text-align: center; }
  .film {
    width: min(1100px, 100%); aspect-ratio: 16 / 9; border-radius: 18px; overflow: hidden; background: #000;
    box-shadow: 0 40px 100px rgba(0,0,0,.6), 0 0 0 1px rgba(255,255,255,.08);
  }
  video { width: 100%; height: 100%; display: block; }
  .actions { display: flex; gap: 14px; flex-wrap: wrap; justify-content: center; margin-top: 36px; }
  a.btn {
    text-decoration: none; font-weight: 600; padding: 13px 26px; border-radius: 999px; font-size: 16px;
  }
  a.primary { color: #fff; background: linear-gradient(135deg, var(--tangerine), var(--blood)); box-shadow: 0 10px 30px rgba(255,94,58,.35); }
  a.secondary { color: var(--peach); border: 1px solid rgba(255,211,168,.35); }
  a.btn:hover { filter: brightness(1.08); }
  footer { margin-top: 28px; color: rgba(255,240,228,.55); font-size: 14px; text-align: center; }
</style>
</head>
<body>
  <header><img src="icon.png" alt=""><h1>Clementine</h1></header>
  <p class="tag">Convert any file by dragging it. Right where it is.</p>
  <div class="film">
    <video controls playsinline preload="metadata" poster="poster.jpg">
      <source src="clementine-launch.mp4" type="video/mp4">
      Your browser can't play this video. <a href="clementine-launch.mp4">Download it</a>.
    </video>
  </div>
  <div class="actions">
    <a class="btn primary" href="https://github.com/mustafahalabi/clementine/releases/latest">Download for macOS</a>
    <a class="btn secondary" href="https://github.com/mustafahalabi/clementine">View on GitHub</a>
  </div>
  <footer>Free · macOS 14 or later · Apple silicon · Signed &amp; notarized · Nothing leaves your Mac</footer>
</body>
</html>
